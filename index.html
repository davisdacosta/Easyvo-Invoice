<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easyvo Invoice Generator</title>
    <link rel="stylesheet" href="landing-page.css">
    <script src="landing-page.js" defer></script>

    <!-- Font Family -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Basic&display=swap" rel="stylesheet">

</head>
<body>
    <!-- Top Navbar -->
    <nav class="top-navbar" role="navigation" aria-label="Top navigation">
        <div class="navbar-left">
            <img id="navbar-logo" src="./images/easyvo-light-mode-logo.jpg" alt="EasyVO Logo" class="navbar-logo">
        </div>
        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">Features</a></li>
            <li><a href="#">FAQs</a></li>
        </ul>
        <!-- Nav-CTA -->
        <a href="#" class="nav-cta">Create invoice</a>
        <div class="navbar-right">
            <button id="theme-toggle-btn" class="theme-toggle-btn" aria-label="Toggle dark mode">
                <img id="theme-icon" src="./icon/moon.svg" alt="Toggle theme" class="theme-icon">
            </button>
        </div>
    </nav>
    <!-- Hero Section -->
     <section class="hero">
        <div class="hero-content">
            <div class="hero-text">
                <div class="eye-brow">
                    <span></span>
                    <p>SIMPLE INVOICING FOR SMALL BUSINESSES</p>
                </div>

                    <h2>Create professional <span>invoices</span> in minutes</h2>

                    Easyvo makes it simple to create clean, professional invoices for your customers without
                    complicated accounting software.
                    </p>
                </article>
                <!-- Hero CTA -->
                    <div class="hero-buttons">
                        <button class="primary-cta">
                        Create an Invoice
                        </button>
                        <button class="secondary-cta">
                        See How It Works
                        </button>
                    </div>
            </div>
            <div class="hero-img">
                <img src="/images/hero-mock-up-.png" alt="Invoice Mockup" class="float-img">

        </div>
